<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadPredictor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <aside class="panel sidebar">
    <div class="logo"><span class="logo-icon">&#9660;</span>LeadPredictor</div>

    <div class="field">
      <label id="language-label">Language</label>
      <div class="flag-select" id="language-select">
        <button type="button" class="flag-select-trigger" id="language-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="language-label">
          <img class="flag-icon" src="https://flagcdn.com/24x18/us.png" width="24" height="18" alt="">
          <span id="language-trigger-text">English</span>
          <svg class="flag-select-chevron" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul class="flag-select-menu" id="language-menu" role="listbox" hidden>
          <li role="option" data-value="en" data-label="English" data-flag="us" aria-selected="true">
            <img class="flag-icon" src="https://flagcdn.com/24x18/us.png" width="24" height="18" alt="">English
          </li>
          <li role="option" data-value="bg" data-label="Bulgarian" data-flag="bg" aria-selected="false">
            <img class="flag-icon" src="https://flagcdn.com/24x18/bg.png" width="24" height="18" alt="">Bulgarian
          </li>
          <li role="option" data-value="de" data-label="German" data-flag="de" aria-selected="false">
            <img class="flag-icon" src="https://flagcdn.com/24x18/de.png" width="24" height="18" alt="">German
          </li>
        </ul>
      </div>
    </div>

    <div class="field">
      <label for="currency">Currency</label>
      <select id="currency">
        <option value="USD" data-symbol="$">$ US Dollar</option>
        <option value="EUR" data-symbol="&#8364;">&#8364; Euro</option>
        <option value="GBP" data-symbol="&#163;">&#163; British Pound</option>
        <option value="BGN" data-symbol="&#1083;&#1074;.">&#1083;&#1074;. Bulgarian Lev</option>
      </select>
    </div>

    <div class="field">
      <label for="campaign-start">Campaign Start</label>
      <div class="date-field">
        <input type="date" id="campaign-start" value="2026-05-08">
        <div class="date-display" id="campaign-start-display" aria-hidden="true"></div>
      </div>
    </div>

    <div class="field">
      <label for="campaign-end">Campaign End</label>
      <div class="date-field">
        <input type="date" id="campaign-end" value="2026-11-04">
        <div class="date-display" id="campaign-end-display" aria-hidden="true"></div>
      </div>
    </div>

    <div class="field">
      <label for="total-revenue">Total Revenue</label>
      <div class="input-prefixed">
        <span class="prefix" id="revenue-prefix">$</span>
        <input type="number" id="total-revenue" value="10000" min="0" step="100">
      </div>
    </div>

    <div class="field">
      <label for="avg-order-value">Avg. Order Value</label>
      <div class="input-prefixed">
        <span class="prefix" id="order-prefix">$</span>
        <input type="number" id="avg-order-value" value="1000" min="1" step="10">
      </div>
    </div>
  </aside>

  <main class="panel chart-panel">
    <div class="chart-wrap">
      <div class="y-axis-label">Months</div>
      <svg id="chart" class="chart" preserveAspectRatio="none"></svg>
    </div>
  </main>

  <aside class="stats">
    <div class="stat-card stat-card--prospects" id="card-prospects">
      <div class="stat-head">
        <span class="stat-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1.5 4.5c0-.55.45-1 1-1h3.5l1.2 1.5H13.5c.55 0 1 .45 1 1v6.5c0 .55-.45 1-1 1h-11c-.55 0-1-.45-1-1v-8Z" fill="currentColor"/></svg>
        </span>
        <span class="stat-name">Prospects</span>
        <span class="stat-pct" id="prospects-pct">100%</span>
      </div>
      <div class="stat-value" id="prospects-value">0</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="prospects-bar" style="width:100%"></div></div>
    </div>

    <div class="stat-card stat-card--leads" id="card-leads">
      <div class="stat-head">
        <span class="stat-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0 1.5c-3 0-5.5 1.5-5.5 3.5v1h11v-1c0-2-2.5-3.5-5.5-3.5Z" fill="currentColor"/></svg>
        </span>
        <span class="stat-name">Leads</span>
        <span class="stat-pct" id="leads-pct">0%</span>
      </div>
      <div class="stat-value" id="leads-value">0</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="leads-bar" style="width:0%"></div></div>
    </div>

    <div class="stat-card stat-card--customers" id="card-customers">
      <div class="stat-head">
        <span class="stat-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 2h8v3.5a4 4 0 0 1-8 0V2Zm-2.5 1.5H4V6a2.5 2.5 0 0 1-2.5-2.5ZM12 3.5h2.5A2.5 2.5 0 0 1 12 6V3.5ZM7 10.4h2v1.6h1.8V13H5.2v-1h1.8v-1.6Z" fill="currentColor"/></svg>
        </span>
        <span class="stat-name">Customers</span>
        <span class="stat-pct" id="customers-pct">0%</span>
      </div>
      <div class="stat-value" id="customers-value">0</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="customers-bar" style="width:0%"></div></div>
    </div>
  </aside>

  <section class="panel sliders">
    <div class="slider-field">
      <label for="lead-rate">Lead Response Rate</label>
      <div class="range-track-wrap">
        <div class="range-track-fill" id="lead-rate-fill"></div>
        <input type="range" id="lead-rate" min="1" max="100" step="0.5" value="40">
      </div>
      <span class="slider-value" id="lead-rate-value">40.00%</span>
    </div>
    <div class="slider-field">
      <label for="prospect-rate">Prospect Response Rate</label>
      <div class="range-track-wrap">
        <div class="range-track-fill" id="prospect-rate-fill"></div>
        <input type="range" id="prospect-rate" min="1" max="100" step="0.5" value="20">
      </div>
      <span class="slider-value" id="prospect-rate-value">20.00%</span>
    </div>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
